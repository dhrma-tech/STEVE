name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: steve
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/steve"
      # Tests create one database per test file on this server (superuser URL).
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      AUTH_SECRET: "ci-only-secret-ci-only-secret-ci-only-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm typecheck
      # Lint errors fail CI. Warnings are tracked as debt.
      - run: pnpm lint:ci
      - run: pnpm test
      - run: pnpm build
